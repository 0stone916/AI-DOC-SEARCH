<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI Search Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- AI 채팅 토글 버튼 -->
<button id="chatToggle" onclick="toggleChat()"
        class="fixed top-6 right-6 bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow-lg flex items-center gap-2 px-4 py-2.5 z-50 transition text-sm font-medium">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-3 3v-3z"/>
    </svg>
    AI에게 질문하기
</button>

<!-- AI 채팅 패널 -->
<div id="chatPanel" class="fixed top-16 right-6 w-96 bg-white rounded-xl shadow-2xl border border-gray-200 flex flex-col hidden z-50" style="height:500px;">
    <div class="bg-blue-600 text-white px-4 py-3 rounded-t-xl flex items-center justify-between">
        <div class="flex items-center gap-2 text-sm font-semibold">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-3 3v-3z"/>
            </svg>
            AI 문서 어시스턴트
        </div>
        <button onclick="toggleChat()" class="hover:text-gray-200 text-lg leading-none">✕</button>
    </div>

    <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div class="flex">
            <div class="bg-gray-100 text-gray-700 rounded-lg px-3 py-2 text-sm max-w-xs leading-relaxed">
                안녕하세요! 문서에 대해 자유롭게 질문해 보세요.<br>
            </div>
        </div>
    </div>

    <div class="border-t border-gray-200 p-3 flex gap-2">
        <input id="chatInput" type="text" placeholder="질문을 입력하세요..."
               class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
               onkeydown="if(event.key==='Enter') sendChat()"/>
        <button onclick="sendChat()"
                class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
            </svg>
        </button>
    </div>
</div>

<div class="max-w-5xl mx-auto px-6 py-10">

    <div class="mb-8 text-center">
        <h1 class="text-3xl font-bold text-gray-800">AI Document Search</h1>
    </div>

    <div class="bg-white rounded-xl shadow p-6 mb-8">
        <div class="flex gap-3">
            <input id="queryInput"
                   type="text"
                   placeholder="예: 작년에 A사랑 맺은 계약"
                   class="flex-1 border border-gray-300 rounded-lg px-4 py-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-400"
                   onkeydown="if(event.key==='Enter') search()" />
            <button onclick="search()"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg transition">
                검색
            </button>
        </div>
        <div class="flex flex-wrap gap-2 mt-3">
            <span class="text-sm text-gray-400">예시:</span>
            <button onclick="setQuery('돈 쓴 내역')" class="text-sm text-blue-500 hover:underline">돈 쓴 내역</button>
            <button onclick="setQuery('새 직원 뽑기')" class="text-sm text-blue-500 hover:underline">새 직원 뽑기</button>
            <button onclick="setQuery('외국 나가는 출장')" class="text-sm text-blue-500 hover:underline">외국 나가는 출장</button>
            <button onclick="setQuery('거래처 약정')" class="text-sm text-blue-500 hover:underline">거래처 약정</button>
        </div>
    </div>


    <div id="loading" class="hidden text-center text-gray-500 py-8">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
        <p class="mt-2">Vertex AI 임베딩 검색 중...</p>
    </div>

    <div id="results" class="hidden grid grid-cols-2 gap-6">
        <div>
            <div class="flex items-center gap-2 mb-3">
                <span class="bg-red-100 text-red-700 text-xs font-bold px-2 py-1 rounded">LIKE 검색</span>
            </div>
            <div id="likeResults" class="space-y-3"></div>
        </div>
        <div>
            <div class="flex items-center gap-2 mb-3">
                <span class="bg-green-100 text-green-700 text-xs font-bold px-2 py-1 rounded">시맨틱 검색</span>
            </div>
            <div id="semanticResults" class="space-y-3"></div>
        </div>
    </div>

</div>

<script>
    function toggleChat() {
        const panel = document.getElementById('chatPanel');
        panel.classList.toggle('hidden');
        if (!panel.classList.contains('hidden')) {
            document.getElementById('chatInput').focus();
        }
    }

    async function sendChat() {
        const input = document.getElementById('chatInput');
        const question = input.value.trim();
        if (!question) return;
        input.value = '';

        appendChatMessage(question, 'user');
        const loadingEl = appendChatLoading();

        try {
            const res = await fetch('/api/chat/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question })
            });
            const data = await res.json();
            loadingEl.remove();
            appendChatMessage(data.answer, 'ai');
        } catch (e) {
            loadingEl.remove();
            appendChatMessage('오류가 발생했습니다. 다시 시도해 주세요.', 'ai');
        }
    }

    function appendChatMessage(text, type) {
        const messages = document.getElementById('chatMessages');
        const wrapper = document.createElement('div');
        wrapper.className = type === 'user' ? 'flex justify-end' : 'flex';
        const bubble = document.createElement('div');
        bubble.className = type === 'user'
            ? 'bg-blue-600 text-white rounded-lg px-3 py-2 text-sm max-w-xs leading-relaxed'
            : 'bg-gray-100 text-gray-700 rounded-lg px-3 py-2 text-sm max-w-xs leading-relaxed';
        bubble.textContent = text;
        wrapper.appendChild(bubble);
        messages.appendChild(wrapper);
        messages.scrollTop = messages.scrollHeight;
    }

    function appendChatLoading() {
        const messages = document.getElementById('chatMessages');
        const wrapper = document.createElement('div');
        wrapper.className = 'flex';
        wrapper.innerHTML = `<div class="bg-gray-100 text-gray-400 rounded-lg px-3 py-2 text-sm animate-pulse">답변 생성 중...</div>`;
        messages.appendChild(wrapper);
        messages.scrollTop = messages.scrollHeight;
        return wrapper;
    }

    function setQuery(q) {
        document.getElementById('queryInput').value = q;
        search();
    }

    async function search() {
        const query = document.getElementById('queryInput').value.trim();
        if (!query) return;

        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('results').classList.add('hidden');

        try {
            const res = await fetch('/api/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query })
            });
            const data = await res.json();
            renderResults(data);
        } catch (e) {
            alert('검색 중 오류가 발생했습니다.');
        } finally {
            document.getElementById('loading').classList.add('hidden');
        }
    }

    function renderResults(data) {
        const likeEl = document.getElementById('likeResults');
        const semanticEl = document.getElementById('semanticResults');

        if (data.like.length === 0) {
            likeEl.innerHTML = `<div class="bg-red-50 border border-red-200 rounded-lg p-4 text-sm text-red-500">
                키워드 불일치 — 검색 결과 없음
            </div>`;
        } else {
            likeEl.innerHTML = data.like.map(doc => `
                <div class="bg-white border border-gray-200 rounded-lg p-4 shadow-sm">
                    <p class="font-medium text-gray-800 text-sm">${doc.title}</p>
                    <div class="flex gap-2 mt-2">
                        <span class="text-xs text-gray-400">${doc.date}</span>
                    </div>
                </div>
            `).join('');
        }

        semanticEl.innerHTML = data.semantic.map(doc => `
            <div class="bg-white border border-green-200 rounded-lg p-4 shadow-sm">
                <p class="font-medium text-gray-800 text-sm">${doc.title}</p>
                <div class="flex gap-2 mt-2 items-center">
                    <span class="text-xs text-gray-400">${doc.date}</span>
                    <span class="ml-auto text-xs font-semibold text-green-600">
                        유사도 ${(doc.similarity * 100).toFixed(1)}%
                    </span>
                </div>
            </div>
        `).join('');

        document.getElementById('results').classList.remove('hidden');
    }
</script>

</body>
</html>
